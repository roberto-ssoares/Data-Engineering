x-airflow-common: &airflow-common
  image: apache/airflow:2.9.3
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    
    # Instala dependências do P01 dentro do Airflow (reprodutível)
    _PIP_ADDITIONAL_REQUIREMENTS: >-
      boto3==1.42.7
      botocore==1.42.7
      jmespath==1.0.1
      numpy==2.3.5
      pandas==2.3.3 
      pyarrow==17.0.0
      py4j==0.10.9.9
      pyspark==4.0.1
      python-dateutil==2.9.0.post0
      pytz==2025.2
      pyyaml==6.0.3
      s3transfer==0.16.0
      six==1.17.0
      tzdata==2025.2
      urllib3==2.6.2

  volumes:
    - ../dags:/opt/airflow/dags
    - ../logs:/opt/airflow/logs
    - ../plugins:/opt/airflow/plugins
    - ../scripts:/opt/airflow/scripts
    - D:/_DE-Projects/Data-Engineering/Data-Lake/P01-Bronze-Silver-Gold:/opt/p01
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    # Persistência no D:\Docker\volumes (Windows)
    volumes:
      - D:/Docker/volumes/p02-airflow/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --password admin \
          --firstname Roberto \
          --lastname Soares \
          --role Admin \
          --email rss.lifelonglearning@gmail.com || true
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    restart: always

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: always
